# Dev-only overrides. See docs/docker-local-development.md.
services:
  processing:
    container_name: ${COMPOSE_DEV_CONTAINER_PREFIX:-}processing
    image: processing:latest
    build:
      context: .
      dockerfile: ./processing.Dockerfile
    # INFO: Mounting processing as volumen allows us to edit data without constant rebuild
    # However, that would also overwrite the `node_modules` that where build inside docker
    # with local data. The second line prevents this overwrite by excepting the `node_modules`
    # from the mounting.
    volumes:
      - ./processing:/processing
      - /processing/node_modules
      # oxfmt config: must not mount under /processing (nested bind breaks Docker Desktop virtiofs)
      - ./app/oxfmt.config.mjs:/mnt/oxfmt.config.mjs:ro
    # INFO: The overwrite of `journald` is needed for mac systems which did not work with `journald`
    logging:
      driver: json-file
    environment:
      # Override DATABASE_HOST and PGHOST to use Docker service name 'db' instead of 'localhost'
      # docker-compose.yml sets PGHOST: ${DATABASE_HOST}, but we need to override PGHOST directly
      # since Docker Compose resolves ${DATABASE_HOST} from .env before override applies
      DATABASE_HOST: db
      PGHOST: db
    # Docker Desktop VM is 8GB (Settings → Resources). db 4g + processing 3g leaves ~1GB for tiles/app.
    # osm2pgsql runs without --slim (node cache in RAM) with --number-processes=4 by default.
    mem_limit: 3g
    mem_reservation: 512m
    cpus: '4'
  app:
    container_name: ${COMPOSE_DEV_CONTAINER_PREFIX:-}app
    image: app:latest
    build:
      context: .
      dockerfile: ./app.Dockerfile
      target: base
      args:
        VITE_APP_ORIGIN: localhost
        VITE_APP_ENV: ${VITE_APP_ENV}
    environment:
      DATABASE_HOST: db
      VITE_APP_ORIGIN: localhost
    logging:
      driver: json-file
    profiles:
      - frontend
  tiles:
    container_name: ${COMPOSE_DEV_CONTAINER_PREFIX:-}tiles
    environment:
      DATABASE_HOST: db
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db/${DATABASE_NAME}
    logging:
      driver: json-file
  db:
    container_name: ${COMPOSE_DEV_CONTAINER_PREFIX:-}db
    # Flags to increase debug levels
    # command: ["-c", "config_file=/postgresql/postgresql.conf", "-c", "log_statement=all", "-c", "log_min_duration_statement=100"]
    logging:
      driver: json-file
    # Performance: Increase shared memory for PostgreSQL (needed for large queries and parallel workers)
    shm_size: 1g
    # 4g fits shared_buffers=1GB + maintenance_work_mem + parallel work_mem (configs/postgres.development.conf).
    # Low reservation so a second worktree stack (DEV_PORT_SLOT) can coexist in the same 8GB VM.
    mem_limit: 4g
    mem_reservation: 1g
    cpus: '4'

configs:
  postgres_conf:
    file: ./configs/postgres.development.conf
  martin_conf:
    file: ./configs/martin.development.yaml
