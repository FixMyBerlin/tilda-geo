[project]
name = "planning-worker"
version = "0.1.0"
description = "Python-Worker des Planungsmoduls (Flächenfinder)"
requires-python = ">=3.12"
dependencies = [
  # Geo-Stack (binäre Wheels, kein System-GDAL nötig)
  "geopandas>=1.0",
  "shapely>=2.0",
  "h3>=4.1",
  "pyproj>=3.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "rasterio>=1.3",
  "scipy>=1.11", # morphologisches Closing (vegetation.py NDVI-Maske)
  "Pillow>=10.0", # WebP-Decoding für Mapterhorn-DEM-Kacheln (dem.py)
  # DB-Zugriff
  "SQLAlchemy>=2.0",
  "GeoAlchemy2>=0.15", # von geopandas.to_postgis benötigt
  "psycopg[binary]>=3.2", # notifies(timeout=...) seit 3.2
]

[tool.uv]
package = false
# Vermeidet Breaking Changes durch taggleiche PyPI-Releases (Supply-Chain-Absicherung).
exclude-newer = "5 days"
