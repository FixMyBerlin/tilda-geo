[project]
name = "planning-worker"
version = "0.1.0"
description = "Python worker of the planning module (Flächenfinder)"
requires-python = ">=3.12"
dependencies = [
  # Geo stack (binary wheels, no system GDAL needed)
  "geopandas>=1.0",
  "shapely>=2.0",
  "h3>=4.1",
  "pyproj>=3.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "rasterio>=1.3",
  "scipy>=1.11", # morphological closing (vegetation.py NDVI mask)
  "Pillow>=10.0", # WebP decoding for Mapterhorn DEM tiles (dem.py)
  # DB access
  "SQLAlchemy>=2.0",
  "GeoAlchemy2>=0.15", # required by geopandas.to_postgis
  "psycopg[binary]>=3.2", # notifies(timeout=...) since 3.2
]

[tool.uv]
package = false
# Avoids breaking changes from same-day PyPI releases (supply-chain protection).
exclude-newer = "5 days"
