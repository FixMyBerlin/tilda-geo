cache_size_mb: 0
cors:
  origin:
    - '*'
postgres:
  connection_string: $DATABASE_URL
  auto_bounds: calc
  auto_publish:
    from_schemas:
      # Never add `space_finder` here: Martin has no session check and those tiles (Flächenfinder
      # scores, census population) are member-only. They are served by the app route
      # /api/regions/:slug/space-finder-tiles (docs/Permissions.md).
      - public
