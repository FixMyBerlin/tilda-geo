# 5 days. @see https://chrispennington.dev/blog/stop-installing-packages-the-second-theyre-published
[install]
minimumReleaseAge = 432000
minimumReleaseAgeExcludes = [
  "typescript",
  "@typescript/typescript-*",
  "@osm-traffic-signs/converter",
]

# Global virtual store — requires isolated linker. Reinstall after changing: rm -rf node_modules && bun install
# Vite dev: server.fs.allow in vite.config.ts (packages realpath into ~/.bun/install/cache/links/).
# Phantom deps in third-party packages: package.json trustedDependencies — see tech-stack bun-install.md
# `nitro` must stay in trustedDependencies so the package stays project-local. Otherwise its
# self-imports (`from "nitro/meta"`) cannot resolve from ~/.bun/install/cache/links/
# (publicHoistPattern does not help packages in the global store). Do not use an npm alias
# (e.g. npm:nitro-nightly): trustedDependencies only matches the published package name.
# @see https://bun.com/docs/pm/global-store
#
# package.json `overrides.rolldown`: Vite and nitro must share one rolldown version. With Vite on
# rolldown 1.2.6 and nitro 3.0.260903-beta, the nitro server bundle referenced an undeclared
# `ssr_exports` in .output/server/_ssr/ssr.mjs → every request 500s at runtime (build still passes).
# Check `grep -n 'var ssr_exports' .output/server/_ssr/ssr.mjs` before removing the override.
linker = "isolated"
globalStore = true
