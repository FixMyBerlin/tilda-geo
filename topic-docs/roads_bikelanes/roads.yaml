    label: Name
    format: sanitized_strings
  - key: name_ref
    label: Referenzname
    format: sanitized_strings
    description: Enthält Kurznamen wie `A 100` oder `B 96`, übernommen aus dem OSM-Tag `ref`.
  - key: length
    format: meter
    label: Länge
    description: Ein berechneter Wert für as OpenStreetMap-Straßensegment. Die Berechnung nutzt die Projektion EPSG:5243 und hat somit eine gute Genaugikeit für Deutschland.
  - key: lifecycle
    label: Status
    values:
      - value: blocked
        label: Gesperrt (Sperrung)
      - value: construction
        label: In Bau
      - value: construction_no_access
        label: Gesperrt aufgrund einer Baustelle
      - value: temporary
        label: Temporärer Weg
  - key: width
    format: meter
    label: Breite
  - key: width_effective
    format: meter
    label: Effektive Breite
  - key: width_source
    purpose: qa
    label: Quelle Breite
    values:
      - value: ALKIS
        label: Aus ALKIS Daten ausgemessen
      - value: ARCore
        label: Mit dem Handy-Metermaß von StreetComplete gemessen
  - key: width_confidence
    purpose: qa
    label: Konfidenz Breite
    values:
      - value: high
        label: Direkt gemessen
        description: Wert stammt aus dem OSM-Tag `width`.
      - value: low
        label: Geschätzt
        description: Wert stammt aus dem OSM-Tag `est_width`, weil `width` fehlt oder nicht geparst werden konnte.
  - key: oneway
    label: Verkehrsrichtung
    values:
      - value: no
        label: Beide Richtungen
      - value: yes
        label: Einbahnstraße
