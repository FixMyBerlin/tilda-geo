title: Routing
summary: Score-free road+bike edges for routing (one row per carriageway, bike lane or path), derived from roads_bikelanes infrastructure.
attributes:
  - key: category
    label: Bauliche Führung
    description: >-
      TILDA-Bikelane-Kategorie (maßgebliche Klassifikation). `mixedTrafficFoot`
      auf Wege-Kanten (`source_table=roadsPathClasses`), wenn keine Self-Kategorie
      vorliegt.
    valuesRef: bikelanes.category
    valuesAdd:
      - value: mixedTrafficMotor
        label: Mischverkehr mit Kfz-Verkehr
        description: Verarbeitung zugewiesen (keine OSM-Kategorie). Fahrbahn-Kante ohne bauliche Radinfrastruktur.
      - value: mixedTrafficFoot
        label: Mischverkehr mit Fußverkehr
        description: Verarbeitung zugewiesen auf Wege-Kanten (`source_table=roadsPathClasses`), wenn keine Self-Bikelane-Kategorie vorliegt.
  - key: road
    ref: roads.road
  - key: parent_road
    ref: bikelanes.parent_road
  - key: adjoining_road
    label: Straßentyp der angrenzenden Straße
    valuesRef: roads.road
    chapterRefs:
      - chapterId: adjoining-road
    description: >-
      Kfz-Straße neben der Radinfrastruktur. Auf `side=self` gleicher Wert wie
      `bikelanes.adjoining_road` (begleitende bzw. bei Querungen die gequerte Straße).
      Auf `side=left`/`right` die Elternstraße, auf der der Streifen liegt
      (`bikelanes.parent_road`).
  - key: adjoining_maxspeed
    ref: bikelanes.adjoining_maxspeed
    description: >-
      Höchstgeschwindigkeit der Kfz-Straße aus `adjoining_road`. Auf `side=left`/`right`
      die der Elternstraße (`bikelanes.parent_maxspeed`).
  - key: maxspeed
    ref: roads.maxspeed
  - key: prefix
    ref: bikelanes.prefix
  - key: offset
    ref: bikelanes.offset
    description: >-
      Wie `bikelanes.offset`: Geometrie bleibt auf der Mittellinie; der Wert ist nur für die Kartendarstellung (`line-offset`). Fehlt auf der Mittellinie (`self`). Sonst halbe Straßenbreite (`road_width`: OSM `width`/`est_width`, sonst Highway-Default), positiv = links, negativ = rechts der Linie. Radinfrastruktur-Kanten (`source_table=bikelanes`) haben dieselbe Linienrichtung wie `bikelanes` (Fahrtrichtung; bei beiden Richtungen links gegen und rechts mit dem OSM-Way). Fahrbahn-Kanten haben keinen Versatz. Transformierte Bikelanes übernehmen den bereits berechneten Wert.
  - key: side
    label: Seite
    purpose: processing
    description: Seite des Segments relativ zur Referenzlinie (left/right/self).
  - key: oneway
    label: Einbahnrichtung
    description: >-
      Nur `yes` oder `no`: darf entgegen der Linienrichtung gefahren werden? Bei `yes`
      zeigt die Geometrie in die erlaubte Fahrtrichtung. Aus `bikelanes.oneway`
      abgeleitet: `implicit_yes` → `yes`; `assumed_no` und `car_not_bike` → `no`.
    values:
      - value: yes
        label: Einbahnig (in Linienrichtung)
      - value: no
        label: In beide Richtungen
  - key: oneway_motor
    label: Einbahnstraße nur für Kfz
    description: >-
      `yes`, wenn nur der Kfz-Verkehr einbahnig ist und Radverkehr in beide Richtungen
      fahren darf (Fahrbahn, Fahrradstraße). Die Geometrie zeigt in Kfz-Fahrtrichtung;
      entgegen der Linie fahren heißt entgegen dem Kfz-Verkehr fahren. Sonst leer.
    values:
      - value: yes
        label: Kfz einbahnig, Rad in beide Richtungen
  - key: parent_id
    label: Parent-Way
    purpose: processing
    description: OSM-Parent-Way (`way/N`) für Carriageway- und Infrastruktur-Kanten. Join-Schlüssel (indiziert).
  - key: source_table
    label: Quelltabelle
    purpose: processing
    description: Kantentyp und TILDA-Tabelle, aus der fachliche Attribute gejoint werden (`bikelanes`, `roads`, `roadsPathClasses`). Join-Schlüssel.
    values:
      - value: bikelanes
        label: Radinfrastruktur
      - value: roads
        label: Straßen
      - value: roadsPathClasses
        label: Wege
        description: >-
          Join-Ziel für Wege-Kanten (Kategorie-ID der Self-Cycleway-Zeile
          oder mixedTrafficFoot). Jede solche Kante muss in roadsPathClasses
          existieren (gleicher Skip-Helper wie der Path-Writer).
  - key: source_id
    label: Quell-ID
    purpose: processing
    description: >-
      `id` in `source_table`; entspricht der Objekt-`id`. Ausnahme: Radfahrstreifen in
      Mittellage haben die Objekt-`id` `way/N/cycleway/self` (neben der Fahrbahn `way/N`),
      `source_id` bleibt `way/N`. Join-Schlüssel (indiziert).
  - key: name
    ref: roads.name
  - key: length
    ref: roads.length
  - key: surface
    ref: roads.surface
  - key: smoothness
    ref: roads.smoothness
  - key: width
    ref: roads.width
  - key: informal
    ref: roads.informal
  - key: access_bicycle
    label: Zugang Radverkehr
    chapterRefs:
      - chapterId: zugang-radverkehr
    description: >-
      Aufgelöster Fahrrad-Zugang (OSM-Kette `bicycle` → `vehicle` → `access`,
      Allowlist). Kein Roh-OSM-Wert. Leer: kein Zugangs-Tag, Radfahren ist erlaubt.
      Kanten mit `no`, `destination`, `private`, `customers`, `delivery`,
      `permit` oder `agricultural_or_forestry` sind im Graphen enthalten, Radfahren ist dort aber nicht erlaubt:
      Router filtern sie selbst. Auf Radinfrastruktur an der Fahrbahn-Mittellinie
      (`side=left`/`right`) leer.
    values:
      - value: yes
        label: Ja
      - value: designated
        label: Gebaut / vorgesehen
      - value: permissive
        label: Geduldet
      - value: use_sidepath
        label: Benutzungspflichtiger Radweg daneben
        description: OSM-Wert auf der Fahrbahn. Neben der Fahrbahn liegt ein benutzungspflichtiger Radweg ([Zeichen 237 (Radweg)](https://trafficsigns.osm-verkehrswende.org/DE?signs=DE:237), [Zeichen 240 (Gemeinsamer Geh- und Radweg)](https://trafficsigns.osm-verkehrswende.org/DE?signs=DE:240) oder [Zeichen 241 (Getrennter Rad- und Gehweg)](https://trafficsigns.osm-verkehrswende.org/DE?signs=DE:241)). Die Kante zählt als routbar, ein Router sollte aber den Radweg daneben bevorzugen.
      - value: optional_sidepath
        label: Radweg daneben, nicht benutzungspflichtig
        description: OSM-Wert auf der Fahrbahn. Neben der Fahrbahn liegt ein Radweg ohne Benutzungspflicht, Radfahren auf der Fahrbahn ist erlaubt. Ein Gehweg mit [Zeichen 1022-10 (Radfahrer frei)](https://trafficsigns.osm-verkehrswende.org/DE?signs=DE:1022-10) gehört nicht dazu, der wird auf dem Gehweg getaggt.
      - value: discouraged
        label: Unerwünscht
      - value: dismount
        label: Absteigen
      - value: destination
        label: Anlieger frei
        description: Radfahren nicht erlaubt (Router filtern die Kante), außer für Anlieger.
      - value: private
        label: Privat
        description: Radfahren nicht erlaubt (Router filtern die Kante).
      - value: customers
        label: Kunden
        description: Radfahren nicht erlaubt (Router filtern die Kante), außer für Kunden.
      - value: delivery
        label: Lieferverkehr
        description: Radfahren nicht erlaubt (Router filtern die Kante), außer für den Lieferverkehr.
      - value: permit
        label: Mit Genehmigung
        description: Radfahren nicht erlaubt (Router filtern die Kante), außer mit Genehmigung.
      - value: agricultural_or_forestry
        label: Land- und Forstwirtschaft
        description: >-
          Radfahren nicht erlaubt (Router filtern die Kante), nur land- oder forstwirtschaftlicher
          Verkehr (OSM `agricultural`, `forestry` und Kombinationen).
      - value: no
        label: Nein
        description: Radfahren nicht erlaubt (Router filtern die Kante).
