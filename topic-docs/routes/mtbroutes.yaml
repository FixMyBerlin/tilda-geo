    label: Ziel
    format: sanitized_strings
  - key: route_description
    label: Freitext zur Route
    format: sanitized_strings
  - key: colours
    label: Farben (mit `/` getrennt)
  - key: website
    label: Website
    format: sanitized_strings
  - key: wikipedia
    label: Wikipedia
    format: sanitized_strings
