name: Regenerate Staging Tiles

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours — matches production so staging battle-tests the red/green cadence.
    - cron: '0 */3 * * *'
permissions:
  contents: read

jobs:
  generate-tiles:
    if: github.repository == 'FixMyBerlin/tilda-geo'
    uses: ./.github/workflows/generate-tiles.yml
    with:
      ENVIRONMENT: staging
      url: https://staging-tiles.tilda-geo.de
      # Red/green does full rebuilds in a staging DB, not reference diffing.
      PROCESSING_DIFFING_MODE: off
      PIPELINE: red-green
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
