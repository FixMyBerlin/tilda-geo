name: Sync Dependabot lock.yaml

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync-nub-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup nub
        uses: nubjs/setup-nub@v0

      # nub has no install-time cooldown (Bun's `--minimum-release-age` has no nub equivalent).
      # The dependency-update cooldown now lives in `.github/dependabot.yml` (`cooldown.default-days`),
      # so this job only needs to regenerate the lockfile to match the bumped package.json.
      - name: Update app lock.yaml
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: nub install --no-frozen-lockfile

      - name: Update processing lock.yaml
        if: hashFiles('processing/package.json') != ''
        working-directory: processing
        run: nub install --no-frozen-lockfile

      - name: Commit lock.yaml changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [[ -f app/lock.yaml ]] && git add app/lock.yaml
          [[ -f processing/lock.yaml ]] && git add processing/lock.yaml

          if git diff --staged --quiet; then
            echo "lock.yaml already in sync"
            exit 0
          fi

          git commit -m "chore(deps): sync lock.yaml with package.json"
          git push
